<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Raytracer</title>
    <style>
        /* Убираем отступы и скроллбары */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }

        /* Делим экран на две колонки */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Каждое окно занимает ровно 50% */
        .window {
            width: 50%;
            height: 100%;
            position: relative;
        }

        /* Разделительная линия посередине */
        #right-window {
            border-left: 2px solid #333;
        }

        /* Подписи поверх окон */
        .label {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            /* Чтобы мышь кликала сквозь текст */
            z-index: 10;
        }
    </style>
    <!-- Подключаем Three.js через CDN -->
    <script src="https://cloudflare.com"></script>
</head>

<body>

    <div class="container">
        <!-- Левое окно: Внешний 3D вид -->
        <div id="left-window" class="window">
            <div class="label">Внешний 3D вид (Three.js)</div>
        </div>

        <!-- Правое окно: Вид из глаз / Градиент -->
        <div id="right-window" class="window">
            <div class="label">Вид из глаз (2D Canvas)</div>
            <canvas id="raycastCanvas"></canvas>
        </div>
    </div>

    <!-- Подключаем нашу логику -->
    <script type="module" src="main.js"></script>
</body>

</html>
